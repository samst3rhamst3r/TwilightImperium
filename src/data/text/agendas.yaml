id: seed_of_an_empire
functional_text: |-
  For:

    The player with the most victory points gains 1 victory point.

  Against:

    The player with the fewest victory points gains 1 victory point.
---
id: shared_research
functional_text: |-
  For:

    Each player's units can move through nebulae.
  
  Against:

    Each player places a command token from their reinforcements in their
    home system, if able.
---
id: minister_of_peace
functional_text: |-
  Elect Player

  The elected player gains this card.

  After a player activates a system that contains 1 or more of a different player's units,
  the owner of this card may discard this card; immediately end the active player's turn.
---
id: minister_of_exploration
functional_text: |-
  Elect Player

  The elected player gains this card.

  When the owner of this card gains control of a planet, they gain 1 trade good.
---
id: conventions_of_war
functional_text: |-
  For:

    Players cannot use BOMBARDMENT against units that are on cultural planets.

  Against:

    Each player that voted "Against" discards all of their action cards.
---
id: anti_intellectual_revolution
functional_text: |-
  For:

    After a player researches a technology, that player must destroy 1 of their non-fighter ships.

  Against:

    At the start of the next strategy phase, each player chooses and exhausts 1 planet
    for each technology that they own.
---
id: representative_government
functional_text: |-
  For:

    Players cannot exhaust planets to cast votes during the agenda phase;
    each player may cast 1 vote on each agenda instead.
  
  Against:

    At the start of the next strategy phase, each player that voted "Against" exhausts
    all of their cultural planets.
---
id: wormhole_reconstruction
functional_text: |-
  For:

    All systems that contain either an alpha or beta wormhole are adjacent to each other.

  Against:

    Each player places a command token from their reinforcements in each system
    that contains a wormhole and 1 or more of their ships.
---
id: arms_reduction
functional_text: |-
  For:

    Each player destroys all but 2 of their dreadnoughts and all but 4 of their cruisers.
  
  Against:

    At the start of the next strategy phase, 
    each player exhausts each of their planets that have a technology specialty.
---
id: miscount_disclosed
functional_text: |-
  When this agenda is revealed, if there are no laws in play, discard this card
  and reveal another agenda from the top of the deck.

  Elect Law

  Vote on the elected law as if it were just revealed from the top of the deck.
---
id: minister_of_war
functional_text: |-
  Elect Player

  The elected player gains this card.

  The owner of this card may discard this card after performing an
  action to remove 1 of their command tokens from the game board
  and return it to their reinforcements; then, they may perform 1
  additional action.
---
id: research_team_cybernetic
functional_text: |-
  Elect Industrial Planet

  Attach this card to the elected planet's card.

  When the owner of the elected planet researches technology, 
  they may exhaust this card to ignore 1 yellow prerequisite.
---
id: holy_planet_of_ixth
functional_text: |-
  Elect Cultural Planet

  Attach this card to the elected planet's card. The planet's owner gains 1 victory point.
  
  Units on this planet cannot use PRODUCTION.

  When a player gains control of this planet, they gain 1 victory point. When a player
  loses control of this planet, they lose 1 victory point.
---
id: enforced_travel_ban
functional_text: |-
  For:

    Alpha and beta wormholes have no effect during movement.

  Against:

    Destroy each PDS in or adjacent to each system that contains a wormhole.
---
id: demilitarized_zone
functional_text: |-
  Elect Cultural Planet

  Attach this card to the elected planet's card. Then, destroy all units
  on that planet.

  Players' units cannot land, be produced, or be placed on this planet.
---
id: shard_of_the_throne
functional_text: |-
  Elect Player

  The elected player gains this card and 1 victory point.

  A player gains this card and 1 victory point when they win a combat against
  the owner of this card. Then, the previous owner of this card loses 1 victory point.
---
id: new_constitution
functional_text: |-
  When this agenda is revealed, if there are no laws in play, discard this card
  and reveal another agenda from the top of the deck.

  For:

    Discard all laws from play. At the start of the next strategy phase, each player
    exhausts each planet in their home system.
  
  Against:

    No effect.
---
id: compensated_disarmament
functional_text: |-
  Elect Planet

  Destroy each ground force on the elected planet; for each unit
  that was destroyed, the player who controls that planet gains 1 trade good.
---
id: judicial_abolishment
functional_text: |-
  When this agenda is revealed, if there are no laws in play, discard this card
  and reveal another agenda from the top of the deck.

  Elect Law

  Discard the elected law from play.
---
id: crown_of_emphidia
functional_text: |-
  Elect Player

  The elected player gains this card and 1 victory point.

  A player gains this card and 1 victory point after they gain control
  of a planet in the home system of this card's owner. Then, the previous
  owner of this card loses 1 victory point.
---
id: mutiny
functional_text: |-
  For:

    Each player that voted "For" gains 1 victory point.

  Against:

    Each player that voted "For" loses 1 victory point.
---
id: minister_of_commerce
functional_text: |-
  Elect Player

  The elected player gains this card.

  After the owner of this card replenishes commodities, they gain
  1 trade good for each player that is their neighbor.
---
id: research_team_biotic
functional_text: |-
  Elect Industrial Planet

  Attach this card to the elected planet's card.

  When the owner of this planet researches technology, they may exhaust
  this card to ignore 1 green prerequisite.
---
id: core_mining
functional_text: |-
  Elect Hazardous Planet

  Attach this card to the elected planet's card. Then, destroy 1 infantry
  on that planet.

  The resource value of this planet is increased by 2.
---
id: fleet_regulations
functional_text: |-
  For:

    Each player cannot have more than 4 tokens in their fleet pool.
  
  Against:

    Each player places 1 command token from their reinforcements into their fleet pool.
---
id: wormhole_research
functional_text: |-
  For:

    Each player who has 1 or more ships in a system that contains a wormhole
    may research 1 technology. Then, destroy all ships in systems that contain
    an alpha or beta wormhole.
  
  Against:

    Each player that voted "Against" removes 1 command token from their command
    sheet and returns it to their reinforcements.
---
id: public_execution
functional_text: |-
  Elect Player

  The elected player discards all of their action cards.
  If that player has the spearker token, they give it to the player to their left.
  The elected player cannot vote on any agendas during this agenda phase.
---
id: research_team_warfare
functional_text: |-
  Elect Hazardous Planet

  Attach this card to the elected planet's card.

  When the owner of this planet researches technology,
  they may exhaust this card to ignore 1 red prerequisite.
---
id: economic_equality
functional_text: |-
  For:

    Each player returns all of their trade goods to the supply.
    Then, each player gains 5 trade goods.

  Against:

    Each player returns all of their trade goods to the supply.
---
id: incentive_program
functional_text: |-
  For:

    Draw and reveal 1 stage I public objective from the deck and place it near
    the public objectives.
  
  Against:

    Draw and reveal 1 stage II public objective from the deck and place it near
    the public objectives.
---
id: executive_sanctions
functional_text: |-
  For:

    Each player can have a maximum of 3 action cards in their hand.

  Against:

    Each player discards 1 random action card from their hand.
---
id: terraforming_initiative
functional_text: |-
  Elect Hazardous Planet

  Attach this card to the elected planet's card.

  The resource and influence values of this planet are increased by 1.
---
id: colonial_redistribution
functional_text: |-
  Elect Non-Home Planet Other than Mecatol Rex

  Destroy each unit on the elected planet. Then, the player who controls
  that planet chooses 1 player with the fewest victory points; that player
  may place 1 infantry from their reinforcements on the elected planet.
---
id: unconventional_measures
functional_text: |-
  For:

    Each player that voted "For" draws 2 action cards.

  Against:

    Each player that voted "For" discards all of their action cards.
---
id: archived_secret
functional_text: |-
  Elect Player

  The elected player draws 1 secret objective.
---
id: crown_of_thalnos
functional_text: |-
  Elect Player

  The elected player gains this card.

  During each combat round, the owner of this card may reroll any number of their dice;
  they must destroy each of their units that did not produce a hit with its reroll.
---
id: regulated_conscription
functional_text: |-
  For:

    When a player produces units, they produce only 1 fighter or infantry
    for its cost instead of 2.

  Against:

    No effect.
---
id: minister_of_sciences
functional_text: |-
  Elect Player

  The elected player gains this card.

  When the owner of this resolves the primary or secondary ability
  of the "Technology" strategy card, they do not need to spend resources to research technology.
---
id: minister_of_policy
functional_text: |-
  Elect Player

  The elected player gains this card.

  At the end of the status phase, the owner of this card
  draws 1 action card.
---
id: homeland_defense_act
functional_text: |-
  For:

    Each player can have any number of PDS units on planets they control.

  Against:

    Each player destroys 1 of their PDS units.
---
id: senate_sanctuary
functional_text: |-
  Elect Cultural Planet

  Attach this card to the elected planet's card.

  The influence value of this planet is increased by 2.
---
id: prophecy_of_ixth
functional_text: |-
  Elect Player

  The elected player gains this card.

  The owner of this card applies +1 to the result of their fighter's combat rolls.
  When the owner of this card uses PRODUCTION, they discard this card
  unless they produce 2 or more fighters.
---
id: research_team_propulsion
functional_text: |-
  Elect Industrial Planet

  Attach this card to the elected planet's card.

  When the owner of this planet researches technology, 
  they may exhaust this card to ignore 1 blue prerequisite.
---
id: swords_to_plowshares
functional_text: |-
  For:

    Each player destroys half of their infantry on each planet they control, rounded up.
    Then, each player gains trade goods equal to the number of their infantry that were destroyed.
  
  Against:

    Each player places 1 infantry from their reinforcements on each planet they control.
---
id: imperial_arbiter
functional_text: |-
  Elect Player

  The elected player gains this card.

  At the end of the strategy phase, the owner of this card
  may discard this card to swap 1 of their strategy cards with 1
  of another player's strategy cards.
---
id: classified_document_leaks
functional_text: |-
  When this agenda is revealed, if there are no scored secret objectives,
  discard this card and reveal another agenda from the top of the deck.

  Elect Scored Secret Objective

  The elected secret objective becomes a public objective;
  place it near the other public objectives in the common play area.
---
id: committee_formation
functional_text: |-
  Elect Player

  The elected player gains this card.

  Before players vote on an agenda that requires a player to be elected,
  the owner of this card may discard this card to choose a player to be elected.
  Players do not vote on that agenda.
---
id: publicize_weapon_schematics
functional_text: |-
  For:

    If any player owns a war sun technology, all players may ignore all prerequisites
    on war sun technologies. All war suns lose SUSTAIN DAMANAGE.

  Against:

    Each player that owns a war sun technology discards all of their action cards.
---
id: ixthian_artifact
functional_text: |-
  For:

    The speaker rolls 1 die. If the result is 6-10, each player may research 2 technologies.
    If the result is 1-5, destroy all units in Mecatol Rex's system,
    and each player with units in systems adjacent to Mecatol Rex's system destroys 3
    of their own units in each of those systems.

  Against:

    No effect.
---
id: minister_of_industry
functional_text: |-
  Elect Player

  The elected player gains this card.

  When the owner of this card places a space dock in a system, that player's units in that system may use their PRODUCTION abilities.
