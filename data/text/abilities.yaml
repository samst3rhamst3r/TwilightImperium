- id: ambush
  functional_text: |-
    At the start of a space combat, you may roll 1 die for each of up to 2 of your cruisers
    or destroyers in the system. For each result equal to or greater than that ship's combat value,
    produce 1 hit; your opponent must assign it to 1 of their ships.

- id: analytical
  functional_text: |-
    When you research a technology that is not a unit upgrade technology, you may ignore 1 prerequisite.

- id: arbiters
  functional_text: |-
    When you are negotiating a transaction, action cards can be exchanged as part of that transaction.

- id: armada
  functional_text: |-
    The maximum number of non-fighter ships you can have in each system is equal to 2 more than the number
    of tokens in your fleet pool.

- id: assimilate
  functional_text: |-
    When you gain control of a planet, replace each PDS and space dock that is on that planet with a
    matching unit from your reinforcements.

- id: blood_ties
  functional_text: |-
    You do not have to spend influence to remove the custodians token from Mecatol Rex.

- id: brilliant
  functional_text: |-
    When you spend a command token to resolve the secondary ability of the "Technology" strategy card,
    you may resolve the primary ability instead.

- id: crafty
  functional_text: |-
    You can have any number of action cards in your hand. Game effects cannot prevent you from using this ability.

- id: creuss_gate
  functional_text: |-
    When you create the game board, place the Creuss Gate (tile 17) where your home system would normally be placed.
    The Creuss Gate system is not a home system. Then, place your home system (tile 51) in your play area.

- id: devotion
  functional_text: |-
    After each space battle round, you may destroy 1 of your cruisers or destroyers in the active system
    to produce 1 hit and assign it to 1 of your opponent's ships in that system.

- id: foresight
  functional_text: |-
    After another player moves ships into a system that contains 1 or more of your ships, you may place
    1 token from your strategy pool in an adjacent system that does not contain another player's ships;
    move your ships from the active system into that system.

- id: fragile
  functional_text: |-
    Apply -1 to the result of each of your unit's combat rolls.

- id: galactic_threat
  functional_text: |-
    You cannot vote on agendas. Once per agenda phase, after an agenda is revealed, you may predict aloud
    the outcome of that agenda. If you prediction is correct, gain 1 technology that is owned by a player
    who voted how you predicted.

- id: gashlai_physiology
  functional_text: |-
    Your ships can move through supernovas.

- id: guild_ships
  functional_text: |-
    You can negotiate transactions with players who are not your neighbors.

- id: harrow
  functional_text: |-
    At the end of each round of ground combat, your ships in the active system may use their BOMBARDMENT
    against your opponent's ground forces on the planet.

- id: indoctrination
  functional_text: |-
    At the start of a ground combat, you may spend 2 influence to replace 1 of
    your opponent's participating infantry with 1 infantry from your reinforcements.

- id: masters_of_trade
  functional_text: |-
    You do not have to spend a command token to resolve the secondary ability of the "Trade" strategy card.

- id: mitosis
  functional_text: |-
    Your space docks cannot produce infantry. At the start of the status phase, place
    1 infantry from your reinforcements on any planet you control.

- id: munitions_reserves
  functional_text: |-
    At the start of each round of space combat, you may spend 2 trade goods; you may reroll any
    number of your dice during that combat round.

- id: nomadic
  functional_text: |-
    You can score objectives even if you do not control the planets in your home system.

- id: orbital_drop
  functional_text: |-
    ACTION: Spend 1 token from your strategy pool to place 2 infantry from your
    reinforcements on 1 planet you control.

- id: peace_accords
  functional_text: |-
    After you resolve the primary or secondary ability of the "Diplomacy" strategy card, you may
    gain control of 1 planet other than Mecatol Rex that does not contain any units and is in
    a system that is adjacent to a planet you control.

- id: pillage
  functional_text: |-
    After 1 of your neighbors gains trade goods or resolves a transation, if that
    neighbor has 3 or more trade goods, you may take 1 of their trade goods or
    commodities.

- id: propagation
  functional_text: |-
    You cannot research technology. When you would research a technology, gain 3
    command tokens instead.

- id: quantum_entanglement
  functional_text: |-
    You treat all systems that contain either an alpha or beta wormhole as adjacent to each other.
    Game effects cannot prevent you from using this ability.

- id: quash
  functional_text: |-
    When an agenda is revealed, you may spend 1 token from your strategy pool to discard that agenda
    and reveal 1 agenda from the top of the deck. Players vote on this agenda instead.

- id: reclamation
  functional_text: |-
    After you resolve a tactical action during which you gained control of Mecatol Rex,
    you may place 1 PDS and 1 space dock from your reinforcements on Mecatol Rex.

- id: scavenge
  functional_text: |-
    After you gain control of a planet, gain 1 trade good.

- id: scheming
  functional_text: |-
    When you draw 1 or more action cards, draw 1 additional action card. Then, choose and discard 1
    action card from your hand.

- id: slipstream
  functional_text: |-
    During your tactical actions, apply +1 to the move value of each of your ships that starts its
    movement in your home system or in a system that contains either an alpha or beta wormhole.

- id: stall_tactics
  functional_text: |-
    ACTION: Discard 1 action card from your hand.

- id: star_forge
  functional_text: |-
    ACTION: Spend 1 token from your strategy pool to place either 2 fighters or 1 destroyer from
    your reinforcements in a system that contains 1 or more of your war suns.

- id: technological_singularity
  functional_text: |-
    Once per combat, after 1 of your opponent's units is destroyed, you may gain 1 technology that
    is owned by that player.

- id: telepathic
  functional_text: |-
    At the end of the strategy phase, place the Naalu "0" token on your strategy card; you are first
    in initiative order.

- id: unrelenting
  functional_text: |-
    Apply +1 to the result of each of your unit's combat rolls.

- id: versatile
  functional_text: |-
    When you gain command tokens during the status phase, gain 1 additional command token.
