- id: military_support
  name: Military Support
  faction_exclusive_id: federation_of_sol
  functional_text: |-
    At the start of the Sol player's turn:
    Remove 1 token from the Sol player's strategy pool, if able, and return it to his reinforcements. Then, you may place 2 infantry from your reinforcements on any planet you control.
    Then, return this card to the Sol player.

- id: promise_of_protection
  name: Promise of Protection
  faction_exclusive_id: mentak_coalition
  functional_text: |-
    ACTION: Place this card faceup in your play area.
    While this card is in your play area, the Mentak player cannot use his PILLAGE faction ability against you.
    If you activate a system that contains 1 or more of the Mentak player's units, return this card to the Mentak player.

- id: greyfire_mutagen
  name: Greyfire Mutagen
  faction_exclusive_id: yin_brotherhood
  functional_text: |-
    After a system is activated:
    The Yin player cannot use faction abilities or faction technology during this tactical action.
    Then, return this card to the Yin player.

- id: fires_of_the_gashlai
  name: Fires of the Gashlai
  faction_exclusive_id: embers_of_muaat
  functional_text: |-
    ACTION: Remove 1 token from the Muaat player's fleet pool and return it to his reinforcements. Then, gain your war sun unit upgrade technology card.
    Then, return this card to the Muaat player.

- id: stymie
  name: Stymie
  faction_exclusive_id: arborec
  functional_text: |-
    ACTION: Place this card faceup in your play area.
    While this card is in your play area, the Arborec player cannot produce units in or adjacent to non-home systems that contain 1 or more of your units.
    If you activate a system that contains 1 or more of the Arborec player's units, return this card to the Arborec player.

- id: cybernetic_enhancements
  name: Cybernetic Enhancements
  faction_exclusive_id: l1z1x_mindnet
  functional_text: |-
    At the start of your turn:
    Remove 1 token from the L1Z1X player's strategy pool and return it to his reinforcements. Then, place 1 command token from your reinforcements in your strategy pool.
    Then, return this card to the L1Z1X player.

- id: acquiescence
  name: Acquiescence
  faction_exclusive_id: winnu_faction
  functional_text: |-
    At the end of the strategy phase:
    Exchange 1 of your strategy cards with a strategy card that was chosen by the Winnu player.
    Then, return this card to the Winnu player.

- id: antivirus
  name: Antivirus
  faction_exclusive_id: nekro_virus
  functional_text: |-
    At the start of a combat:
    Place this card faceup in your play area. While this card is in your play area, the Nekro player cannot use his TECHNOLOGICAL SINGULARITY faction ability against you.
    If you activate a system that contains 1 or more of the Nekro player's units, return this card to the Nekro player.

- id: gift_of_prescience
  name: Gift of Prescience
  faction_exclusive_id: naalu_collective
  functional_text: |-
    At the end of the strategy phase:
    Place this card faceup in your play area and place the Naalu "0" token on your strategy card; you are first in initiative order. The Naalu player cannot use his TELEPATHIC faction ability during this game round.
    Return this card to the Naalu player at the end of the status phase.

- id: war_funding
  name: War Funding
  faction_exclusive_id: barony_of_letnev
  functional_text: |-
    At the start of a round of space combat:
    The Letnev player loses 2 trade goods.
    During this combat round, reroll any number of your dice.
    Then, return this card to the Letnev player.

- id: raghs_call
  name: Ragh's Call
  faction_exclusive_id: clan_of_saar
  functional_text: |-
    After you commit 1 or more units to land on a planet:
    Remove all of the Saar player's ground forces from that planet and place them on a planet controlled by the Saar player.
    Then, return this card to the Saar player.

- id: research_agreement
  name: Research Agreement
  faction_exclusive_id: universities_of_jolnar
  functional_text: |-
    After the Jol-Nar researches a technology that is not a faction technology:
    Gain that technology.
    Then, return this card to the Jol-Nar player.

- id: tekklar_legion
  name: Tekklar Legion
  faction_exclusive_id: sardakk_norr
  functional_text: |-
    At the start of ground combat:
    Apply +1 to the result of each of your unit's combat rolls during this combat. If your opponent is the N'orr player, apply -1 to the result of each of his unit's combat rolls during this combat.
    Then, return this card to the N'orr player.

- id: political_favor
  name: Political Favor
  faction_exclusive_id: xxcha_kingdom
  functional_text: |-
    When an agenda is revealed:
    Remove 1 token from the Xxcha player's strategy pool and return it 
    to their reinforcements. Then, discard the revealed agenda and reveal 
    1 agenda from the top of the deck. Players vote on this agenda instead. 
    Then, return this card to the Xxcha player.

- id: spy_net
  name: Spy Net
  faction_exclusive_id: yssaril_tribes
  functional_text: |-
    At the start of your turn:
    Look at the Yssaril player's hand of action cards. Choose 1 of those cards and add it to your hand.
    Then, return this card to the Yssaril player.

- id: trade_convoys
  name: Trade Convoys
  faction_exclusive_id: emirates_of_hacan
  functional_text: |-
    ACTION: Place this card faceup in your play area.
    While this card is in your play area, you may negotiate transactions with players who are not your neighbor.
    If you activate a system that contains 1 or more of the Hacan player's units, return this card to the Hacan player.

- id: creuss_iff
  name: Creuss IFF
  faction_exclusive_id: ghosts_of_creuss
  functional_text: |-
    At the start of your turn during the action phase:
    Place or move a Creuss wormhole token into either a system that contains a planet you control or a non-home system that does not contain another player's ships.
    Then, return this card to the Creuss player.

- id: trade_agreement
  name: Trade Agreement
  functional_text: |-
    When the __PLAYER_COLOR__ player replenishes commodities:
    The __PLAYER_COLOR__ player gives you all of his commodities.
    Then, return this card to the __PLAYER_COLOR__ player.

- id: political_secret
  name: Political Secret
  functional_text: |-
    When an agenda is revealed:
    The __PLAYER_COLOR__ player cannot vote, play action cards, or use faction abilities until after that agenda has been resolved.
    Then, return this card to the __PLAYER_COLOR__ player.

- id: ceasefire
  name: Ceasefire
  functional_text: |-
    After the __PLAYER_COLOR__ player activates a system that contains 1 or more of your units:
    The __PLAYER_COLOR__ player cannot move units into the active system.
    Then, return this card to the __PLAYER_COLOR__ player.

- id: support_for_the_throne
  name: Support for the Throne
  functional_text: |-
    When you receive this card, if you are not the __PLAYER_COLOR__ player, you must place it faceup in your play area and gain 1 victory point.
    If you activate a system that contains 1 or more of the __PLAYER_COLOR__ player's units, or if the blue player is eliminated, lose 1 victory point and return this card to the blue player.
