# Every faction will be formatted in the following way:
# 
#   id:                     Unique identifier for the faction, internally used for lookups only
#   name:                   Unique name of the faction
#   max_commodities:        Numerical value which is the max commodities this faction can hold
#   starting_units:         List of StartingUnitConfig objects
#     - unit_class:           [class of unit]
#       num:                  [number of units]
#   starting_tech_ids:      List of technologies this faction starts the game with
# 
# Note: All other "faction-specific" information, such as unique abilities, are coded as backwards
# references - that is, an ability has a faction_exclusive_id reference. Guarantees a 1:1 mapping
# between abilities and factions. Minimizes drift.

