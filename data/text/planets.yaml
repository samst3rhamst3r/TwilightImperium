- id: 0_0_0
  flavor_text: |-
    This elusive energy-rich planet was the desperate destination of the Lazax diaspora. Now, it is a technological nightmare.

- id: abyz
  flavor_text: |-
    Its thick, complex atmosphere is inhospitable to most races, but Abyz is known for its seemingly endless natural reserves of rare minerals and precious metals.

- id: arc_prime
  flavor_text: |-
    Below the thin surface atmosphere lie the content-sized caverns of the Letnev. Rich in metals and energy, its vast fungus fields struggle to feed its population.

- id: archon_ren
  flavor_text: |-
    Populated by small arboreal villages, this planet's only true urban center is the royal city of Kklaj. The Xxcha home world and home to the renowned library of Xuun.

- id: archon_tau
  flavor_text: |-
    Ravaged by Sol and Letnev bombardments during the Twilight Wars. The Xxcha commit substantial resources to rebuilding its ecology and cleansing its toxic continents.

- id: arinam
  flavor_text: |-
    Isolated planet poor in resources but rich in natural beauty. Boasts many exotic resorts frequented by the rich and famous of the galaxy.

- id: arnor
  flavor_text: |-
    Lush, green world that is renowned for some of the most fertile soil in the galaxy. Dominated by endless fields and the processing facilities of large agricultural firms.

- id: arretze
  flavor_text: |-
    Also called the "Moving Sand." The desert home of the Hacan Mowshir trade families and the great orbital trading ports of Haal, Shimax, and Dry Wind.

- id: bereg
  flavor_text: |-
    A frozen world that is inhospitable to most races. Indentured laborers risk attacks from arctic sharaks in the infamous lodinium mines.

- id: centauri
  flavor_text: |-
    Venerable world with few resources but a rich history. Site of important treaties between several races during the Twilight wars.

- id: corneeq
  flavor_text: |-
    Former garden world that has subsequently enjoyed increased industrialization. Home to the esteemed Free World's Academy of Military Science and Research.

- id: creuss
  flavor_text: |-
    Trapped between matter and void lies the realm of Creuss. Made of trapped light and radioactive gas, this realm hosts the most peculiar forms of life.

- id: dal_bootha
  flavor_text: |-
    A populous planet whose resources have been severely depleted. Well-educated citizenry and many universities, but dependent on foreign imports.

- id: darien
  flavor_text: |-
    Darien is the heart of the Brotherhood's realm. Here, within the great Monastery of Lucas, rests the Yin, the holy egg from which all the Brotherhood were made.

- id: druaa
  flavor_text: |-
    Despite its oversized poles, one of the most beautiful of planets. Its flowered steppes, violet mountains, and glowing forests are famous across the galaxy.

- id: fria
  flavor_text: |-
    Brutally cold ice world populated only by a few scattered mining camps. Despite brutal climate, highly prized for its deposits of rare ores used in starship drives.

- id: gral
  flavor_text: |-
    Backwater planet with modest resources and an unassuming populace. Most noted for the reliable and affordable vehicles produced in its factories.

- id: hercant
  flavor_text: |-
    Also called the "Fire Sand." Seat of the Quieron, the Hacan council, and the Sword Fleet. Harbors the greatest of the famous Hacan moving cities.

- id: jol
  flavor_text: |-
    Covered by cold oceans and a few inhospitable islands. The seat of the Headmaster, the Hylar ruler, who dwells in the deep underwater city of Wun-Escha.

- id: jord
  flavor_text: |-
    Dinstinctly seasonal, with the greatest variety of climates and ecologies in the galaxy. The Federation of Sol rules the Jord humans from the great city of New Moscow.

- id: kamdorn
  flavor_text: |-
    Also called the "Dream Sand." The least populated of the Hacan planets, but the center of Hacan mythology and religion. The only known source of starflowers.

- id: lazar
  flavor_text: |-
    The only inhabited world in a forgettable system. Few native resources and only rudimentary, often underdeveloped, industries.

- id: lirta_iv
  flavor_text: |-
    Covered in vast swamps and fetid bogs. Home to rare biochemcial compounds unique to its marshlands used in everything from exotic foods to biogenic drugs.

- id: lisis_ii
  flavor_text: |-
    The crystal caverns of Lisis II are the source of most of the Jorun colonists' water and foodstuffs. Notable for the great crescent-shaped valley of Gavar.

- id: lodor
  flavor_text: |-
    Wealthy planet ruled by powerful biotech consortiums. Rumored to harbor hidden caches of outlawed bacterial weapons.

- id: lor
  flavor_text: |-
    Wreathed in vast seas of methane ice. Seafloor drilling platforms harvest rare crystals used in advanced computers and energy weapons.

- id: maaluuk
  flavor_text: |-
    Mostly pungent marshland and mudplains. Original world of the Naalu race, which now enslaves the winged Miashan to work its great iron-extraction plants.

- id: mecatol_rex
  flavor_text: |-
    Once a splendid place, now a sad devastated wasteland. Only the radiation-shielded Mecatol city, the seat of the powerful Galactic Council, remains habitable.

- id: meer
  flavor_text: |-
    Hellish world immolated in the inferno of its nearby sun. Famed for the fiery majesty of its surface when viewed from the safety of its many orbital stations.

- id: mehar_xull
  flavor_text: |-
    Unstable radiation belts create hazardous living conditions but facilitate research in electro-quantum propulsion technologies.

- id: mellon
  flavor_text: |-
    Poor in natural resources but rich in exotic plant and animal life. Protected as a planetary xenological garden and lifeform preserve.

- id: moll_primus
  flavor_text: |-
    In places lush and rich, in others a barren wasteland. This old Lazax penal colony has prospered under the rule of the governing Mentak Coalition.

- id: mordai_ii
  flavor_text: |-
    Mined to its bones by the virulent Nekro, Mordai II is reinforced by graviton energy beams that barely keep the world from collapsing in on itself.

- id: muaat
  flavor_text: |-
    The fiery surface of Muaat is uninhabitable to most races. It is home to the Gashlai, and only here can they live outside of their cumbersome ember suits.

- id: nar
  flavor_text: |-
    Covered by mild oceans and a small archipelago called The Reef by off-worlders. The Circle of Regents makes its home in the underwater city-school of Nuun-Dascha.

- id: nestphar
  flavor_text: |-
    The fungal world of Nestphar is home to the symbiotic Arborec. Nestphar's orbit is filled with Flaah spores that extend its Symphony.

- id: new_albion
  flavor_text: |-
    Rare atmospheric composition and biochemistry support lifeforms unlike any others in the galaxy.

- id: quann
  flavor_text: |-
    Since the discovery of the Beta Wormhole, this temperate planet with two continents and one large ocean has been a haven for traders and smugglers alike.

- id: qucen_n
  flavor_text: |-
    After the Twilight Wars, existed for centuries as a near-utopia of scattered communal farms free from governmental interference.

- id: quinarra
  flavor_text: |-
    Enormous and oceanless. Not only the largest planet supporting sentient life, but also the one with the least moisture. Home to the Sardakk N'orr hive-cities.

- id: ragh
  flavor_text: |-
    The capital colony of the Saar and the epicenter of the Saar religion. Also called "Ragh's Call" by the Saar.

- id: rarron
  flavor_text: |-
    Large, populous world with three distinctive moons renowned for its biomodification clinics and cyber boutiques.

- id: resculon
  flavor_text: |-
    Poor in natural resources, but a nearby nexus of major trade routes has brought it increasing wealth as interstallar commerce has intensified.

- id: retillion
  flavor_text: |-
    A mix of tundra, swamps, rivers and dense forests. Home to the mysterious, chamelionic Yssaril, whose capital Wueca has eluded all attempts at cartography.

- id: sakulag
  flavor_text: |-
    Jungle planet plagued by dangerous predators such as the arboreal razeden. Home to many exotic biochemcials and natural pharmaceuticals.

- id: saudor
  flavor_text: |-
    Prosperous planet with large native population and substantial industry. Extreme axial tilt results in long day-night cycles that some races find uncomfortable.

- id: shalloq
  flavor_text: |-
    Covered with tundra, wetlands, and rainforest, much like its sister-planet Retillion. Home to Mojeb, the only major Yssaril city catalogued by off-worlders.

- id: starpoint
  flavor_text: |-
    Large planet with eight small moons that supply a wide range of valuable resources. Acidic rains and toxic storms make it an unappealing destination for tourists.

- id: tar_mann
  flavor_text: |-
    Small, isolated planet with small population and modest resources. Most famous for its delicious avinberries.

- id: tequ_ran
  flavor_text: |-
    Desolate planet transformed into weapons testing facility for large defense consortiums.

- id: thibah
  flavor_text: |-
    Burdened by overpopulation and low mineral content in teh planetary crust. Historically used as a staging world for deep-space exploration and trade.

- id: torkan
  flavor_text: |-
    Populous planet almost completely dependent on foreign imports to sustain the extravagant lifestyles of its citizens.

- id: tren_lak
  flavor_text: |-
    Icy and desolate. Other than the ferocious snow dracs and the rare icemoon flowers, life is restricted to the N'orr boomtowers and ice mines.

- id: vefut_ii
  flavor_text: |-
    Massive, rocky world cursed with extreme gravity. Underground cities support advanced research in antigravity technologies.

- id: wellon
  flavor_text: |-
    Sky cities suspended in helium-rich atmosphere more noted for fantastic views than the small quantities of exotic elements harvested by their chemical mines.

- id: winnu
  flavor_text: |-
    The shining cities of the Winnu are the last places where authentic Lazax art and culture are still revered.

- id: wren_terra
  flavor_text: |-
    Arid, windy, and populated primarily by predatory Daartar hounds. The Barony utilizes large swaths of its northern steppes for low-yield agriculture.

- id: xxehan
  flavor_text: |-
    Known for genetically complex native lifeforms adapted to tainted atmosphere and toxic biochemistry.

- id: zohbat
  flavor_text: |-
    Known for its highly intoxicating Zohlian whiskey and the planetary space elevator that links the surface with orbital stations and shipyards.
