- id: trade_agreement
  player_color_functional_text: 
    ["When the", "player replenishes commodities:
    The", "player gives you all of his commodities.
    Then, return this card to the", "player."]

- id: political_secret
  player_color_functional_text: 
    ["When an agenda is revealed:
    The", "player cannot vote, play action cards, or use faction abilities until after that agenda has been resolved.
    Then, return this card to the", "player."]

- id: ceasefire
  player_color_functional_text: 
    ["After the", "player activates a system that contains 1 or more of your units:
    The", "player cannot move units into the active system.
    Then, return this card to the", "player."]

- id: support_for_the_throne
  player_color_functional_text: 
    ["When you receive this card, if you are not the", "player, you must place it faceup in your play area and gain 1 victory point.
    If you activate a system that contains 1 or more of the", "player's units, or if the", "player is eliminated, lose 1 victory point and return this card to the", "player."]